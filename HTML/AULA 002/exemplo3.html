<body>
    <section>
        <h1>Cdastro de Preferências</h1>

        <form>
            <!-- campo de nome -->
            <label for="nome ">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required><br><br>

            <!-- campo de e-mail -->
            <label for="email ">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required><br><br>

            <!-- campo de seleção(select) -->
            <label for="país ">Selecione seu País</label>
            <select id="país" name="país">
                <option value="brasil">Brasil</option>
                <option value="portugal">Portugal</option>
                <option value="espanha">Espanha</option>
                <option value="outros">Outros</option>
            </select><br><br>

            <!-- campo de gênero (radio) -->
            <p>Gênero</p>
            <input type="radio" id="masculino" name="gênero" value="masculino">
            <label for="masculino">Masculino</label><br>
            <input type="radio" id="feminino" name="gênero" value="feminino">
            <label for="feminino">Feminino</label><br>
            <input type="radio" id="outro" name="gênero" value="outro">
            <label for="outro">Outro</label><br>
    
            <button type="submit">Enviar</button>
    </form>
      </section>
    
    
    </body>
